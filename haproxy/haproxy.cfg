# HAProxy conf for load balancing, http requests forwarded to backend webservers in roundrobin fashion

global
    log /dev/log local0
    maxconn 2048
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_front
    bind *:80  # LISTENING ON port 80 fot http
    default_backend servers_back  # forwarding to backend

backend servers_back
    balance roundrobin  # Requests are distributed evenly
    server web01 54.237.147.80:80 check  # web server 1
    server web02 13.221.238.172:80 check  # Web server 2