global
    log /dev/log local0
    maxconn 2048
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_front
    bind *:80
    default_backend servers_back

backend servers_back
    balance roundrobin
    server web01 54.237.147.80:80 check
    server web02 13.221.238.172:80 check